apiVersion: v1
kind: Plugin
metadata:
  author: dou
  name: langbot-silent-observer
  version: 0.1.0
  label:
    en_US: Silent Observer
    zh_Hans: 静默观察者
  description:
    en_US: Memory-first silent observer with history buffer injection.
    zh_Hans: 记忆优先静默观察者，缓冲群聊历史，触发时注入上下文。
spec:
  config:
    - name: bot_qq
      type: string
      label:
        en_US: Bot QQ Number
        zh_Hans: 机器人QQ号
      description:
        en_US: Used to detect @mentions targeting the bot
        zh_Hans: 用于判断是否被@提及
      required: true
    - name: reply_probability
      type: float
      label:
        en_US: Reply Probability
        zh_Hans: 主动插话概率
      description:
        en_US: Reply probability for non-@ messages. 0=never, 1=always.
        zh_Hans: 非@消息的回复概率，0=永不插话，1=每条都回复
      default: 0.01
      required: false
    - name: history_count
      type: integer
      label:
        en_US: History Count
        zh_Hans: 历史消息条数
      description:
        en_US: Number of recent messages to inject into prompt when triggered.
        zh_Hans: 触发时注入 prompt 的最近消息条数
      default: 20
      required: false
    - name: kb_id
      type: string
      label:
        en_US: Knowledge Base UUID
        zh_Hans: 知识库 UUID
      description:
        en_US: UUID of the LangRAG knowledge base for chat history archive. Leave empty to disable KB features.
        zh_Hans: 用于聊天记录归档的 LangRAG 知识库 UUID。留空禁用 KB 功能。
      default: ""
      required: false
    - name: embedding_model_uuid
      type: string
      label:
        en_US: Embedding Model UUID
        zh_Hans: 嵌入模型 UUID
      description:
        en_US: UUID of the embedding model (e.g. seekdb-local). Required if kb_id is set.
        zh_Hans: 嵌入模型的 UUID（如 seekdb-local）。填写 kb_id 时必填。
      default: ""
      required: false
    - name: timeline_max_chars
      type: integer
      label:
        en_US: Timeline Max Chars
        zh_Hans: 时间线最大字符数
      description:
        en_US: Max total characters in the timeline injected into prompt. Older messages are dropped first.
        zh_Hans: 注入 prompt 的时间线最大总字符数，超出时从最旧消息开始丢弃
      default: 2000
      required: false
    - name: vision_max_images
      type: integer
      label:
        en_US: Vision Max Images
        zh_Hans: 视觉识图最大张数
      description:
        en_US: Max number of images to describe per message via vision API.
        zh_Hans: 每条消息最多调用视觉 API 识别的图片数量
      default: 5
      required: false
    - name: vision_enabled
      type: boolean
      label:
        en_US: Enable Vision
        zh_Hans: 启用视觉识别
      description:
        en_US: Enable AI image description via vision LLM. Requires vision_model_uuid to be set.
        zh_Hans: 启用 AI 图片识别（需配置视觉模型 UUID）
      default: false
      required: false
    - name: vision_model_uuid
      type: string
      label:
        en_US: Vision Model UUID
        zh_Hans: 视觉模型 UUID
      description:
        en_US: UUID of the vision-capable LLM (e.g. qwen3.6-flash). Required if vision_enabled is true.
        zh_Hans: 视觉模型的 UUID（如 qwen3.6-flash）。启用 vision_enabled 时必填
      default: ""
      required: false
    - name: vision_all_messages
      type: boolean
      label:
        en_US: Vision All Messages
        zh_Hans: 所有消息都识图
      description:
        en_US: If enabled, describe images in ALL messages (not just triggered ones). Requires vision_enabled.
        zh_Hans: 开启后所有消息的图片都会识别（不仅限于触发消息）。需先启用 vision_enabled
      default: false
      required: false
    - name: vision_daily_limit
      type: integer
      label:
        en_US: Vision Daily Limit
        zh_Hans: 每日识图上限
      description:
        en_US: Max vision API calls per day. 0 = unlimited.
        zh_Hans: 每日视觉 API 调用上限，0 = 不限制
      default: 0
      required: false
    - name: debug_dump
      type: boolean
      label:
        en_US: Debug Dump
        zh_Hans: 调试输出
      description:
        en_US: Dump full prompt to /tmp/silent_prompt_dump.log for debugging.
        zh_Hans: 将完整 prompt 输出到 /tmp/silent_prompt_dump.log 用于调试
      default: false
      required: false
    - name: reflection_enabled
      type: boolean
      label:
        en_US: Enable Reflection
        zh_Hans: 启用反思
      description:
        en_US: Enable the reflection layer — bot learns from user corrections. Requires reflection_model_uuid.
        zh_Hans: 启用反思层——bot 从用户纠正中学习。需配置反思生成模型 UUID。
      default: false
      required: false
    - name: reflection_model_uuid
      type: string
      label:
        en_US: Reflection Model UUID
        zh_Hans: 反思生成模型 UUID
      description:
        en_US: UUID of the LLM used for reflection generation (e.g. qwen3.6-flash). Separate from the main answering model to avoid single-agent bias.
        zh_Hans: 反思生成 LLM 的 UUID（如 qwen3.6-flash）。与主回答模型分离以避免单一代理偏见。
      default: ""
      required: false
    - name: reflection_daily_limit
      type: integer
      label:
        en_US: Reflection Daily Batch Cap
        zh_Hans: 每日反思整合批次数上限
      description:
        en_US: Max consolidation batches per day (rate guard; trigger is event-driven). 0 = default 10.
        zh_Hans: 每日批量反思整合次数上限（失控兜底；触发为事件驱动）。0 = 默认 10
      default: 10
      required: false
    - name: compression_enabled
      type: boolean
      label:
        en_US: Enable Context Compression
        zh_Hans: 启用上下文压缩
      description:
        en_US: Enable Anchored Incremental Summarization — compresses old messages into a structured summary, keeping token usage stable while expanding context coverage from ~1 day to ~1 week. Requires kb_enabled and a compression model UUID.
        zh_Hans: 启用锚定增量摘要——将旧消息压缩为结构化摘要，保持 token 用量不变的同时将上下文覆盖从约 1 天扩展到约 1 周。需要开启 KB 并配置压缩模型 UUID。
      default: false
      required: false
    - name: compression_model_uuid
      type: string
      label:
        en_US: Compression Model UUID
        zh_Hans: 压缩模型 UUID
      description:
        en_US: UUID of the LLM used for summary compression. Falls back to reflection_model_uuid if empty.
        zh_Hans: 摘要压缩 LLM 的 UUID。为空时 fallback 到 reflection_model_uuid。
      default: ""
      required: false
    - name: compression_tail_max_chars
      type: integer
      label:
        en_US: Tail Max Characters
        zh_Hans: Tail 最大字符数
      description:
        en_US: Recent messages within this character budget are preserved verbatim (tail). Older messages are compressed into the summary.
        zh_Hans: 最近消息在此字符预算内保留原文（Tail），更早的消息压缩进摘要。
      default: 1500
      required: false
    - name: compression_cooldown_minutes
      type: integer
      label:
        en_US: Compression Cooldown (minutes)
        zh_Hans: 压缩冷却时间（分钟）
      description:
        en_US: Minimum interval between two compression runs for the same session.
        zh_Hans: 同一会话两次压缩的最短间隔。
      default: 10
      required: false
    - name: compression_history_count
      type: integer
      label:
        en_US: Compression History Count
        zh_Hans: 压缩历史条数
      description:
        en_US: Number of recent messages to consider for compression. Older messages beyond this window are not covered by the summary.
        zh_Hans: 压缩窗口的消息条数。此窗口之外的消息不被摘要覆盖。
      default: 200
      required: false
  components:
    EventListener:
      fromDirs:
        - path: components/event_listener/
    Tool:
      fromDirs:
        - path: components/tool/
execution:
  python:
    path: main.py
    attr: Plugin
